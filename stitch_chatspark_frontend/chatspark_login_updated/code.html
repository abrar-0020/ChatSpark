<body class="bg-background text-on-surface antialiased min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop overflow-hidden relative">
<!-- Subtle Ambient Glow -->
<div class="bg-glow"></div>
<!-- Main Content Canvas (Transactional Intent - Nav Shell Suppressed) -->
<main class="w-full max-w-[440px] relative z-10">
<!-- Login Card (Level 1 Surface) -->
<div class="bg-surface-container rounded-xl border border-surface-variant p-8 md:p-10 relative overflow-hidden">
<!-- Subtle Top Accent Glow on Card -->
<div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-primary-container to-transparent opacity-50"></div>
<!-- Header Section -->
<div class="text-center mb-8 flex flex-col items-center">
<div class="w-12 h-12 bg-surface-container-high rounded-xl flex items-center justify-center border border-surface-variant mb-4 relative group cursor-default">
<div class="absolute inset-0 bg-primary-container rounded-xl blur-md opacity-20 group-hover:opacity-40 transition-opacity duration-500"></div>
<span class="material-symbols-outlined text-primary-container text-[28px] relative z-10" style="font-variation-settings: 'FILL' 1;">electric_bolt</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary-container mb-2 tracking-tight">ChatSpark</h1>
<p class="font-body-md text-body-md text-on-surface-variant opacity-80">Ignite your workspace collaboration.</p>
</div>
<!-- Form Container -->
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface block" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-opacity-50 text-[20px]">mail</span>
</div>
<input class="w-full bg-background border border-surface-variant text-on-surface font-body-md text-body-md rounded-lg pl-10 pr-4 py-3 focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all duration-200 placeholder-on-surface-variant/30 shadow-sm" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface block" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary-container hover:text-primary transition-colors" href="#">Forgot?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-opacity-50 text-[20px]">lock</span>
</div>
<input class="w-full bg-background border border-surface-variant text-on-surface font-body-md text-body-md rounded-lg pl-10 pr-4 py-3 focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all duration-200 placeholder-on-surface-variant/30 shadow-sm" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container hover:brightness-110 text-white font-label-md text-label-md py-3.5 px-4 rounded-lg transition-all duration-200 shadow-[0_0_15px_rgba(255,101,0,0.15)] hover:shadow-[0_0_25px_rgba(255,101,0,0.3)] active:scale-[0.98] flex justify-center items-center gap-2" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="mt-8 mb-6 relative flex items-center">
<div class="flex-grow border-t border-surface-variant"></div>
<span class="flex-shrink-0 mx-4 text-on-surface-variant font-label-sm text-label-sm uppercase tracking-wider">Or continue with</span>
<div class="flex-grow border-t border-surface-variant"></div>
</div>
<!-- Social Logins (Ghost Style) -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 bg-transparent border border-surface-variant hover:border-on-surface-variant hover:bg-surface-bright/50 text-on-surface font-label-md text-label-md py-3 rounded-lg transition-all duration-200 active:scale-[0.98]" type="button">

</svg>
